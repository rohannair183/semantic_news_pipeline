# Guardian client defaults
base_url: "https://content.guardianapis.com"
default_page_size: 50
max_page_size: 50
timeout_seconds: 30
# Profiles: mapping of profile_name -> profile config
# Each profile may include the following fields:
#   topic (required): string - topic text used for the search (e.g. "technology").
#   run_date (optional): date|string|datetime - date to search (YYYY-MM-DD) or datetime; defaults to today UTC.
#   page_size (optional): int - number of items per page (1..max_page_size); defaults to `default_page_size`.
#   query (optional): string - full query string to send as `q` (overrides `topic` when present).
#   extra_filters (optional): mapping - additional query params to include in the request (e.g. {'section': 'science'}).
#   order_by (optional): string - ordering value for results (default: "newest").
#   use_next_fallback (optional): bool - if true, use /content/{id}/next deep-pagination when /search pages are exhausted.
profiles:
  technology_daily:
    topic: "technology"
    order_by: "newest"
    use_next_fallback: true
  science_daily:
    topic: "science"
    order_by: "newest"
    use_next_fallback: true

# Optional article ingestor orchestration settings.
# - profiles_to_run: if provided, only these profile names are ingested.
# - limit_per_profile: optional max number of ids/items fetched per profile.
# - save_local_checkpoint: write one JSON checkpoint file per profile when true.
# - checkpoint_dir: local directory for checkpoint files.
article_ingestor:
  profiles_to_run:
    - technology_daily
    - science_daily
  limit_per_profile: 20
  save_local_checkpoint: true
  checkpoint_dir: checkpoints/article_ingestor

# YAML-driven row mappings used by ArticleNormalizer when converting checkpoints
# into tabular rows. Each output field lists one or more source paths and an
# optional transform. Source paths are resolved in order until a non-empty value
# is found.
article_normalizer:
  row_mappings:
    profile:
      sources:
        - profile
        - payload.profile
    api_id:
      sources:
        - id
    web_title:
      sources:
        - webTitle
        - fields.headline
    headline:
      sources:
        - fields.headline
    byline:
      sources:
        - fields.byline
    section:
      sources:
        - sectionName
    published_at:
      sources:
        - webPublicationDate
      transform: parse_iso
    first_publication_date:
      sources:
        - fields.firstPublicationDate
      transform: parse_iso
    url:
      sources:
        - webUrl
    body_text:
      sources:
        - fields.bodyText
        - fields.body
    trail_text:
      sources:
        - fields.trailText
    thumbnail:
      sources:
        - fields.thumbnail
    wordcount:
      sources:
        - fields.wordcount
    pillar:
      sources:
        - pillarName
    last_modified:
      sources:
        - fields.lastModified
        - lastModified
      transform: parse_iso
