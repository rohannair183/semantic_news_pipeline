# Guardian client defaults
base_url: "https://content.guardianapis.com"
default_page_size: 50
max_page_size: 50
timeout_seconds: 30
# Profiles: mapping of profile_name -> profile config
# Each profile may include the following fields:
#   topic (optional): string - topic text used for the search (e.g. "technology"). Empty means no topic filter.
#   run_date (optional): date|string|datetime - single day override for this profile (YYYY-MM-DD) or datetime.
#   from_date/to_date (optional): explicit date-window override for this profile.
#   timeframe (optional): per-profile timeframe override using:
#     - mode: relative|explicit
#     - relative: past_day|past_week|past_month
#     - explicit: from_date/to_date
#   page_size (optional): int - number of items per page (1..max_page_size); defaults to `default_page_size`.
#   query (optional): string - full query string to send as `q` (overrides `topic` when present). Empty string allowed.
#   section (optional): string - Guardian section filter to apply to search requests.
#   order_by (optional): string - ordering value for results (default: "newest").
#   use_next_fallback (optional): bool - if true, use /content/{id}/next deep-pagination when /search pages are exhausted.
#   content_show_fields (optional): string - comma-separated `show-fields` value used for article detail fetches (default: "all").
profiles:
  main_daily:
    topic: ""
    timeframe:
      mode: "relative"
      relative: "past_day"
    order_by: "newest"
    section: ""
    use_next_fallback: true
    content_show_fields: "all"
  main_weekly:
    topic: ""
    timeframe:
      mode: "relative"
      relative: "past_week"
    order_by: "newest"
    section: ""
    use_next_fallback: true
    content_show_fields: "all"

# Optional article ingestor orchestration settings.
# - profiles_to_run: if provided, only these profile names are ingested.
# - limit_per_profile: optional max number of ids/items fetched per profile.
# - save_local_checkpoint: write one JSON checkpoint file per profile when true.
# - checkpoint_dir: local directory for checkpoint files.
# - enable_usage_logging: write minimal API usage logs when true.
# - logs_dir: directory for usage log files.
article_ingestor:
  profiles_to_run:
    - main_daily
    - main_weekly
  limit_per_profile: 10
  save_local_checkpoint: true
  checkpoint_dir: checkpoints/article_ingestor
  enable_usage_logging: true
  logs_dir: logs

# YAML-driven row mappings used by ArticleNormalizer when converting checkpoints
# into tabular rows. Each output field lists one or more source paths and an
# optional transform. Source paths are resolved in order until a non-empty value
# is found.
article_normalizer:
  row_mappings:
    profile:
      sources:
        - profile
        - payload.profile
    api_id:
      sources:
        - id
    web_title:
      sources:
        - webTitle
        - fields.headline
    headline:
      sources:
        - fields.headline
    byline:
      sources:
        - fields.byline
    section:
      sources:
        - sectionName
    published_at:
      sources:
        - webPublicationDate
      transform: parse_iso
    first_publication_date:
      sources:
        - fields.firstPublicationDate
      transform: parse_iso
    url:
      sources:
        - webUrl
    body_text:
      sources:
        - fields.bodyText
        - fields.body
    trail_text:
      sources:
        - fields.trailText
    thumbnail:
      sources:
        - fields.thumbnail
    wordcount:
      sources:
        - fields.wordcount
    pillar:
      sources:
        - pillarName
    last_modified:
      sources:
        - fields.lastModified
        - lastModified
      transform: parse_iso
