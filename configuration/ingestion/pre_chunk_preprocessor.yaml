# Declarative preprocessing rules for chunk-ready parquet output.
pre_chunk_preprocessor:
  output_dir: checkpoints/pre_chunk
  operations:
    - name: trim_whitespace_columns
      args:
        columns:
          - headline
          - body_text
    - name: filter_min_numeric
      args:
        column: wordcount
        min_value: 500
    - name: drop_empty_rows
      args:
        required_columns:
          - body_text
    - name: normalize_text_columns
      args:
        columns:
          - body_text
    - name: drop_columns
      args:
        columns:
          - thumbnail
          - trail_text
          - profile
          - api_id
          - web_title
          - byline
          - section
          - published_at
          - first_publication_date
          - url
          - pillar
          - last_modified
          - wordcount
