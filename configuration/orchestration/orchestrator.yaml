# Full local smoke pipeline order (mirror root smoke scripts).
fail_fast: true
tasks:
  - id: article_ingestor
    kind: article_ingestor
    skip_when:
      missing_env_var: GUARDIAN_API_KEY
  - id: article_normalizer
    kind: article_normalizer
    params:
      day: utc_today
  - id: pre_chunk_preprocessor
    kind: pre_chunk_preprocessor
  - id: chunking
    kind: chunking
    params:
      profile: default
  - id: embeddings
    kind: embeddings
    params:
      profile: default
  - id: vector_sync
    kind: vector_sync
    skip_when:
      missing_env_vars:
        - SUPABASE_URL
        - SUPABASE_SERVICE_ROLE_KEY
    params:
      profile: default
  - id: briefing_persistence
    kind: briefing_persistence
    skip_when:
      missing_env_vars:
        - SUPABASE_URL
        - SUPABASE_SERVICE_ROLE_KEY
        - SUPABASE_POSTGRES_URL
