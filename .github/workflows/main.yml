name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Get changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run pylint
        if: steps.changed.outputs.files != ''
        run: pylint ${{ steps.changed.outputs.files }}

      - name: Run ruff
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Run unit coverage
        run: coverage run --source=src -m unittest discover -s tests/unit -p "test_*.py"

      - name: Enforce coverage threshold
        run: coverage report --fail-under=99.5

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"
