name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run pylint
        run: pylint src tests

      - name: Run ruff when available
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed; skipping"
          fi

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Run unit coverage
        run: coverage run --source=src -m unittest discover -s tests/unit -p "test_*.py"

      - name: Enforce coverage threshold
        run: coverage report --fail-under=100

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"
