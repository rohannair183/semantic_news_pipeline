name: Orchestrator pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrator-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project, CI tooling, and runtime (embeddings)
        run: |
          python -m pip install --upgrade pip
          # [runtime] pulls sentence-transformers (embeddings YAML default provider).
          pip install -e ".[ci,runtime]"

      - name: Fail fast if ingestion secret missing
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          if [ -z "$GUARDIAN_API_KEY" ]; then
            echo "::error title=Missing secret::Add GUARDIAN_API_KEY under Settings → Secrets and variables → Actions (or attach an Environment secret with the required key)."
            exit 1
          fi

      - name: Run YAML orchestrator (full preset)
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python -m src.application --config configuration/application/orchestrator.yaml

      - name: Commit and push pipeline outputs to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkpoints logs
          if git diff --cached --quiet; then
            echo "No checkpoint/log changes to commit."
            exit 0
          fi
          git commit -m "chore: update pipeline outputs from run ${GITHUB_RUN_ID}"
          git push origin HEAD:main

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            checkpoints/**
            logs/**
