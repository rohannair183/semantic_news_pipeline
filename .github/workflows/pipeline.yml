name: Orchestrator pipeline

on:
  workflow_dispatch:

jobs:
  orchestrator-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Run YAML orchestrator (CI preset)
        run: python -m src.application --config configuration/application/orchestrator.yaml
