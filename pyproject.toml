[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-news-pipeline"
version = "0.1.0"
description = "Semantic news pipeline"
requires-python = ">=3.9.6"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "pandas>=1.5.0",
  "pyarrow>=12.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]

[tool.ruff]
src = ["src", "tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 99.5
show_missing = true

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pylint>=3.3",
  "astroid>=3.3",
  "pyright",
  "ruff",
]

ci = [
  "pytest",
  "pytest-cov",
  "pylint>=3.3",
  "astroid>=3.3",
]
